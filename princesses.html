<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Princesses — Game of Beauties</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ——— ОБЩИЙ СТИЛЬ ——— */
        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            min-height: 100vh;
            padding: 2rem 0;
        }

        /* Делаем ширину как на сайте с футболистами */
        .container-custom {
            width: 95%;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ——— КАРТОЧКИ ——— */
        .card {
            border: none;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 40px -12px rgba(120, 80, 150, 0.25);
            transition: all 0.2s ease;
        }

        .card-header,
        .card-footer {
            background: transparent;
            border: none;
        }

        /* ——— ХЕДЕР ——— */
        .princess-header {
            background: linear-gradient(145deg, #f8e8ff, #fce4ec);
            border-radius: 32px 32px 0 0 !important;
            padding: 1.8rem 1rem 1.2rem;
            border-bottom: 2px solid rgba(255, 215, 245, 0.5);
        }

        .princess-header h3 {
            color: #4a2c5e;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(255, 215, 245, 0.6);
        }

        .princess-header h3 small {
            font-weight: 300;
            color: #7b5a8c;
            font-size: 1.1rem;
        }

        /* ——— НАВИГАЦИЯ ——— */
        .nav-tabs .nav-link {
            border: none;
            border-radius: 40px;
            padding: 0.6rem 1.4rem;
            margin: 0.2rem;
            color: #5a3d6b;
            font-weight: 500;
            background: transparent;
            transition: all 0.2s;
        }

        .nav-tabs .nav-link:hover {
            background: rgba(255, 215, 245, 0.5);
            color: #3a1f4a;
            transform: translateY(-1px);
        }

        .nav-tabs .nav-link.active {
            background: #d4b0d9;
            color: #2d1a3a;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(180, 120, 200, 0.3);
        }

        /* ——— СЕКЦИЯ-ПРИВЕТСТВИЕ ——— */
        .princess-welcome {
            background: linear-gradient(135deg, rgba(212, 176, 217, 0.3), rgba(180, 139, 196, 0.2));
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 20px 30px;
            margin-bottom: 25px;
            border: 2px solid rgba(212, 176, 217, 0.3);
            box-shadow: 0 8px 20px -8px rgba(150, 100, 170, 0.15);
        }

        .princess-welcome h4 {
            color: #4a2c5e;
            font-weight: 600;
            margin: 0;
        }

        /* ——— КАРТОЧКИ ПРИНЦЕСС ——— */
        .princess-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid rgba(212, 176, 217, 0.25);
            box-shadow: 0 8px 20px -8px rgba(150, 100, 170, 0.12);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .princess-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px -10px rgba(150, 100, 170, 0.25);
            background: rgba(255, 255, 255, 0.9);
        }

        /* Фиксированный контейнер для фото с сохранением пропорций */
        .card-img-container {
            width: 100%;
            height: 220px;
            background: rgba(255, 240, 250, 0.4);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(212, 176, 217, 0.25);
        }

        .princess-card .card-img-top {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* Картинку больше не плющит */
            transition: transform 0.3s ease;
        }

        .princess-card:hover .card-img-top {
            transform: scale(1.04);
        }

        .princess-card .card-title {
            color: #4a2c5e;
            font-weight: 600;
            font-size: 1.15rem;
            margin-top: 10px;
            margin-bottom: 6px;
        }

        .princess-card .player-info small {
            font-size: 0.85rem;
            color: #6b4d7c !important;
            margin-bottom: 2px;
        }

        .princess-card .card-text {
            color: #6e547e;
            font-size: 0.85rem;
            line-height: 1.35;
        }

        .princess-card .btn-buy {
            background: linear-gradient(135deg, #d4b0d9, #b58bc4);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
        }

        .princess-card .btn-buy:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(180, 120, 200, 0.45);
            background: linear-gradient(135deg, #c79fd0, #a97bb9);
        }

        .princess-card .badge-star {
            background: rgba(212, 176, 217, 0.25);
            color: #8c4c9e;
            border-radius: 40px;
            padding: 4px 12px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* ——— ФУТЕР ——— */
        .card-footer {
            border-radius: 0 0 32px 32px !important;
            background: rgba(255, 245, 250, 0.5);
            backdrop-filter: blur(4px);
            color: #5a3d6b;
            font-weight: 300;
        }
    </style>
</head>

<body>

    <div class="container-custom">

        <!-- ===== ХЕДЕР ===== -->
        <header class="card card-header princess-header mb-3">
            <div class="card-body text-center py-2">
                <h3 class="card-title mb-0">
                    <i class="fas fa-crown me-2"></i>Game of Beauties
                    <br><small><i class="fas fa-sparkles me-1"></i>Study well and create your own perfect world!</small>
                </h3>
            </div>
        </header>

        <!-- ===== ОСНОВНАЯ КАРТОЧКА ===== -->
        <div class="card mb-4">

            <!-- Табы -->
            <div class="card-body pb-0">
                <ul class="nav nav-tabs justify-content-center flex-wrap">
                    <li class="nav-item">
                        <a class="nav-link" href="./index.html">
                            <i class="fas fa-scroll me-1" style="color:#b58bc4;"></i>Rules & Rate
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="./princesses.html">
                            <i class="fas fa-crown me-1" style="color:#b58bc4;"></i>Princesses
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./princes.html">
                            <i class="fas fa-chess-king me-1" style="color:#b58bc4;"></i>Princes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./castles.html">
                            <i class="fas fa-landmark me-1" style="color:#b58bc4;"></i>Castles
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./pets.html">
                            <i class="fas fa-paw me-1" style="color:#b58bc4;"></i>Pets
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./Vera.html">
                            <i class="fas fa-star me-1" style="color:#b58bc4;"></i>Vera's World
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./Zlata.html">
                            <i class="fas fa-gem me-1" style="color:#b58bc4;"></i>Zlata's World
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./Vika.html">
                            <i class="fas fa-heart me-1" style="color:#b58bc4;"></i>Vika's World
                        </a>
                    </li>
                   <li class="nav-item">
                        <a class="nav-link" href="./Zoe.html">
                            <i class="fas fa-spa me-1" style="color:#b58bc4;"></i>Zoe's World
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./wheel.html">
                            <i class="fas fa-circle-notch me-1" style="color:#b58bc4;"></i>Fortune Wheel
                        </a>
                    </li>
                </ul>
            </div>

            <!-- ===== КОНТЕНТ ===== -->
            <div class="card-body px-4 py-3">

                <!-- Приветственная секция -->
                <div class="princess-welcome text-center">
                    <h4><i class="fas fa-crown me-2"></i>Princesses and their Value</h4>
                </div>

                <!-- Заголовок -->
                <h5 class="card-title text-center mb-4">
                    <i class="fas fa-gem me-2" style="color:#b58bc4;"></i>
                    Choose your Princess
                    <i class="fas fa-gem ms-2" style="color:#b58bc4;"></i>
                </h5>

                <!-- Сетка под карточки: 4 в ряд на десктопе, 2 на планшете, 1 на мобильном -->
                <div class="row g-3 justify-content-start" id="node_for_insert">
                    <!-- Карточки будут вставляться напрямую сюда из princesses.js -->
                </div>

            </div>

        </div>

        <!-- ===== ФУТЕР ===== -->
        <footer class="card card-footer">
            <div class="card-body text-center py-3">
                <p class="mb-0">
                    <i class="fas fa-crown me-1" style="color:#b58bc4;"></i>
                    © Game of Beauties
                    <i class="fas fa-crown ms-1" style="color:#b58bc4;"></i>
                </p>
            </div>
        </footer>

    </div>

    <script crossorigin="anonymous" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="princesses.js"></script>

</body>

</html>
